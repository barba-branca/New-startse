name: Deploy Django to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'new-start-se'
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências localmente (para verificação)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar arquivos estáticos
        run: |
          python manage.py collectstatic --noinput
        env:
          DJANGO_SECRET_KEY: 'temporary-key-for-build'
          DEBUG: 'False'
          ALLOWED_HOSTS: '*'

      - name: Deploy para Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
