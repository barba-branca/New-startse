# Pipeline de Deploy para Azure App Service
# Documentação: https://docs.microsoft.com/azure/app-service/deploy-github-actions

name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite execução manual

env:
  AZURE_WEBAPP_NAME: 'SEU-APP-NAME'  # <- Substitua pelo nome do seu App Service
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Criar ambiente virtual e instalar dependências
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar arquivos estáticos
        run: |
          source venv/bin/activate
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Criar arquivo zip para deploy
        run: |
          zip -r release.zip . -x "venv/*" -x ".git/*" -x "*.pyc" -x "__pycache__/*" -x ".env"

      - name: Upload artifact para deploy
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Descompactar artifact
        run: unzip release.zip

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy para Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Executar migrações do Django
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config set --resource-group SEU-RESOURCE-GROUP --name ${{ env.AZURE_WEBAPP_NAME }} --startup-file "python manage.py migrate && gunicorn core.wsgi:application --bind=0.0.0.0:8000"
