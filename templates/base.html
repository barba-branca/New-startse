{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block 'title' %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'geral/css/base.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block 'head' %}{% endblock 'head' %}
</head>

<body>
    {% block 'body' %}{% endblock 'body' %}
    
    <footer style="margin-top: 50px; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; opacity: 0.6; font-size: 13px;">
        <p style="color: white; margin-bottom: 0;">🚀 Produzido por <a href="https://developscode.com.br" target="_blank" style="color: #a855f7; text-decoration: none; font-weight: 600;">Develops Code</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
